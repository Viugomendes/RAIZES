{% load i18n %}{# The theme button, like the panel's: the label and icon of the current state (theme.js). #}
<button type="button" class="theme-toggle header-button" title="{% translate 'Change theme' %}">
  <span class="theme-label theme-label-auto">{% translate "Change theme (now: automatic)" %}</span>
  <span class="theme-label theme-label-light">{% translate "Change theme (now: light)" %}</span>
  <span class="theme-label theme-label-dark">{% translate "Change theme (now: dark)" %}</span>
  <svg class="icon theme-icon-auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path class="icon-fill" d="M12 4a8 8 0 0 1 0 16z"/></svg>
  <svg class="icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
  <svg class="icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>
</button>
