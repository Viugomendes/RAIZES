# The invented family used for tests, examples and screenshots.
#
# NONE OF THESE PEOPLE EXIST. Every surname is the name of a tree, to make
# that obvious. Load it with:  python manage.py load_demo
#
# It contains, on purpose, every hard case the site must handle:
#   - four generations above the central person and one below
#   - a person with three unions (Joaquim)
#   - a central person with three parental figures: mother, father and
#     stepfather (Lia)
#   - a family of eight siblings (the children of Anselmo and Dalva)
#   - an uncle younger than his niece and nephew (Gabriel)
#   - an adoptive child (Jonas), a dating relationship (Lia and Davi)
#   - a person whose father is unknown (Rui), deceased people and children
#   - uncertain data: approximate dates, unknown years, an unconfirmed person
#
# The interview link points to "Big Buck Bunny", an openly licensed short film
# by the Blender Foundation, standing in for a real interview.

family_name = "Família Carvalho Figueira"
central_person = "lia-carvalho-1996"

