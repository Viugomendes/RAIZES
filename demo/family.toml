[[recipes]]
slug = "bolo-de-fuba-da-dalva"
title = "Bolo de fubá da vó Dalva"
author = "dalva-oliveira-1944"
text = """
**Ingredientes:** 3 ovos, 2 xícaras de fubá, 1 xícara de açúcar, 1 xícara de leite, meia xícara de óleo, 1 colher de fermento e uma pitada de erva-doce.

**Modo de preparo:** bata tudo, menos o fermento, que entra por último. Forno médio por quarenta minutos. Não abra o forno antes da hora.
"""

[[recipes]]
slug = "arroz-de-forno-da-cecilia"
title = "Arroz de forno da tia Cecília"
author = "cecilia-figueira-1964"
text = """
**Ingredientes:** arroz cozido do dia anterior, frango desfiado, milho, ervilha, creme de leite e queijo para gratinar.

**Modo de preparo:** misture tudo menos o queijo, espalhe numa travessa, cubra com o queijo e leve ao forno até dourar.
"""

[[recipes]]
slug = "pao-de-queijo-da-olga"
title = "Pão de queijo da tia Olga"
author = "olga-figueira-1943"
text = """
**Ingredientes:** 500 g de polvilho, 1 copo de leite, meio copo de óleo, 2 ovos, 250 g de queijo meia-cura ralado e sal.

**Modo de preparo:** escalde o polvilho com o leite e o óleo ferventes, deixe amornar, junte os ovos e o queijo e faça bolinhas. Forno quente por vinte e cinco minutos.
"""